[project]
name = "pact"
version = "0.1.0"
description = "The transaction layer for agentic commerce"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "band-sdk>=4.0.0",
    "moss>=1.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.vercel]
entrypoint = "pact.server:app"